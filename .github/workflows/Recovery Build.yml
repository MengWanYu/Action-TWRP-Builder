name: Recovery 编译
on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest仓库地址（若使用SSH密钥，格式为git@github.com:XXXXX）'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Manifest分支'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: '设备树仓库地址'
        required: true
        default: 'https://github.com/MengWanYu/android_device_vivo_PD2183'
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: '设备树在源码中的路径'
        required: true
        default: 'device/vivo/PD2183'
      COMMON_TREE_URL:
        description: '通用设备树地址（无则留空）'
        required: false
      COMMON_PATH:
        description: '通用设备树在源码中的路径（无则留空）'
        required: false
      DEVICE_NAME:
        description: '设备名称'
        required: true
        default: 'PD2183'
      MAKEFILE_NAME:
        description: 'Makefile名称（不含.mk后缀）'
        required: true
        default: 'twrp_PD2183'
      BUILD_TARGET:
        description: '编译目标（如recovery）'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 显示运行参数
        run: |
          echo "::group::用户环境变量"
          echo "Manifest地址: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest分支: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "设备树地址: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "设备树分支: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "设备树路径: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "设备名称: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile名称: ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "编译目标: ${{ github.event.inputs.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: 安装OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: 配置SSH密钥（如需）
        if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') || startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 安装repo工具
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: 初始化repo（同步源码）
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "Nico170420"
          git config --global user.email "b170420nc@gmail.com"
          repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        id: pwd

      - name: 同步源码（repo sync）
        run: |
          repo sync -j$(nproc --all) --force-sync
        working-directory: workspace

      - name: 克隆设备树
        run: |
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: 克隆通用设备树（如需）
        if: |
          github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != ''
        run: |
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: 检查构建树类型
        uses: haya14busa/action-cond@v1
        id: buildtree
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' }}
          if_true: twrp
          if_false: omni

      - name: Apply device patches
        run: |
          PATCH_SCRIPT="${{ github.event.inputs.DEVICE_PATH }}/ota_protection/patch_aosp.py"
          if [ -f "$PATCH_SCRIPT" ]; then
            echo "Device patch script found"
            echo "=== Applying device patches to manifest recovery ==="
            python3 "$PATCH_SCRIPT" bootable/recovery
          else
            echo "No device patch script, using default sources"
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        continue-on-error: true
      - name: 同步设备依赖
        run: |
          DEPS_FILE="${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies"
          SCRIPT_PATH="${GITHUB_WORKSPACE}/scripts/convert.sh"
          if [ -f "$DEPS_FILE" ]; then
            bash "$SCRIPT_PATH" "$DEPS_FILE"
            repo sync -j$(nproc --all)
          else
            echo "⚠️  无额外依赖文件，跳过"
          fi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        continue-on-error: true

      - name: 准备编译环境
        run: |
          sudo rm -rf zopfli /usr/bin/zopflipng
          sudo apt update && sudo apt install -y git build-essential cmake libpng-dev
          git clone https://github.com/google/zopfli.git --depth 1
          cd zopfli && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc --all)
          if [ -f "./zopflipng" ]; then
            sudo cp ./zopflipng /usr/bin/
            echo "✅ zopflipng installed"
          fi
          cd ../..
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 tar

      - name: 设置交换空间
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 释放内存
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/go /opt/hostedtoolcache/CodeQL
          sudo apt-get purge -y --auto-remove azure-cli google-cloud-sdk firefox dotnet-* || true
          sudo apt-get clean
          df -h
          free -h

      - name: 编译Recovery
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          make clean
          LINK_PATH="${{ steps.pwd.outputs.workspace-folder }}/out/host/linux-x86/bin/zopflipng"
          mkdir -p "$(dirname $LINK_PATH)"
          sudo ln -sf /usr/bin/zopflipng $LINK_PATH
          echo "✅ zopflipng linked to out/"
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: 上传编译产物到Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/system/bin/updater
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor*.img
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            🔧 编译信息：
            - Manifest分支: ${{ github.event.inputs.MANIFEST_BRANCH }}
            - 设备名称: ${{ github.event.inputs.DEVICE_NAME }}
            - 编译目标: ${{ github.event.inputs.BUILD_TARGET }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
